name: TestFlight

# Signed Release archive of the iPhone app (io.traaitt.osx), exported as an
# App Store .ipa and uploaded to TestFlight. Separate from ci.yml, which keeps
# building the unsigned simulator app.
#
# Needs the repository secrets IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD,
# IOS_PROFILE_BASE64, IOS_WIDGET_PROFILE_BASE64 (<bundle>.widget),
# IOS_WATCH_PROFILE_BASE64 (<bundle>.watchkitapp), ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID.

on:
  # workflow_dispatch only works once this file is on the default branch;
  # until then a push to the release branch starts the upload.
  push:
    branches: [cursor/xte-android-release-7b71]
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner image
        default: macos-15-intel
      xcode:
        description: Xcode version prefix to use (newest match wins)
        default: "26"
      upload:
        description: Upload the .ipa to TestFlight
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 120
    env:
      BUNDLE_ID: io.traaitt.osx
    steps:
      - uses: actions/checkout@v4

      - name: Build number
        # Must increase per upload; 1020 is the version already in the project.
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 1100 ))" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_${{ inputs.xcode || '26' }}*.app 2>/dev/null | sort -V | tail -1)
          test -n "$XCODE" || { echo "::error::No Xcode ${{ inputs.xcode }} on this runner"; exit 1; }
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR=$XCODE/Contents/Developer xcodebuild -version
          DEVELOPER_DIR=$XCODE/Contents/Developer xcodebuild -showsdks | grep -i iphoneos
          # The Apple Watch companion needs the watchOS SDK.
          if ! DEVELOPER_DIR=$XCODE/Contents/Developer xcodebuild -showsdks | grep -qi watchos; then
            DEVELOPER_DIR=$XCODE/Contents/Developer xcodebuild -downloadPlatform watchOS
          fi
          DEVELOPER_DIR=$XCODE/Contents/Developer xcodebuild -showsdks | grep -i watchos

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
      - run: yarn install --frozen-lockfile

      - name: pod install
        working-directory: ios
        run: pod install

      - name: Install signing certificate and profiles
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
          WATCH_PROFILE_BASE64: ${{ secrets.IOS_WATCH_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

          # App, widget extension and watch app each have their own App Store profile.
          install_profile() {
            local var="$1" data="$2" file="$RUNNER_TEMP/$1.mobileprovision"
            test -n "$data" || { echo "::error::$var secret is missing"; exit 1; }
            echo "$data" | base64 --decode > "$file"
            security cms -D -i "$file" > "$RUNNER_TEMP/$1.plist"
            local uuid
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/$1.plist")
            echo "$var: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/$1.plist") ($uuid)"
            for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$dir"
              cp "$file" "$dir/$uuid.mobileprovision"
            done
            echo "${var}_UUID=$uuid" >> "$GITHUB_ENV"
          }
          install_profile PROFILE "$PROFILE_BASE64"
          install_profile WIDGET_PROFILE "$WIDGET_PROFILE_BASE64"
          install_profile WATCH_PROFILE "$WATCH_PROFILE_BASE64"

      - name: Manual signing for the app, widget and watch targets
        working-directory: ios
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Only our targets are signed manually; pods keep their settings.
          ruby -rxcodeproj -e '
            profiles = { "XTE" => ENV["PROFILE_UUID"], "XTEWidgets" => ENV["WIDGET_PROFILE_UUID"], "XTEWatch" => ENV["WATCH_PROFILE_UUID"] }
            project = Xcodeproj::Project.open("XTE.xcodeproj")
            profiles.each do |name, uuid|
              target = project.targets.find { |t| t.name == name } or abort("missing target #{name}")
              target.build_configurations.each do |config|
                next unless config.name == "Release"
                s = config.build_settings
                s["CODE_SIGN_STYLE"] = "Manual"
                s["DEVELOPMENT_TEAM"] = ENV["TEAM_ID"]
                s["CODE_SIGN_IDENTITY"] = "Apple Distribution"
                s["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
                s["CODE_SIGN_IDENTITY[sdk=watchos*]"] = "Apple Distribution"
                s["PROVISIONING_PROFILE_SPECIFIER"] = uuid
                s["PROVISIONING_PROFILE"] = uuid
              end
            end
            project.save
          '

      - name: Archive (Release, generic iOS device)
        working-directory: ios
        run: |
          # Report every compile error in one run instead of stopping at the first.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          set +e
          xcodebuild \
            -workspace XTE.xcworkspace \
            -scheme XTE \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/XTE.xcarchive" \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive > xcodebuild-archive.log 2>&1
          status=$?
          grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" xcodebuild-archive.log | head -100
          if [ "$status" -ne 0 ]; then tail -200 xcodebuild-archive.log; fi
          exit "$status"

      - name: Export .ipa
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_UUID}</string>
              <key>${BUNDLE_ID}.widget</key><string>${WIDGET_PROFILE_UUID}</string>
              <key>${BUNDLE_ID}.watchkitapp</key><string>${WATCH_PROFILE_UUID}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/XTE.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa)
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          unzip -o -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APP=$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' -c 'Print :DTSDKName' -c 'Print :DTXcode' "$APP/Info.plist"
          test -f "$APP/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP/Info.plist"
          codesign -dv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier"
          for bundle in "$APP"/PlugIns/*.appex "$APP"/Watch/*.app; do
            test -d "$bundle" || { echo "::error::missing embedded bundle $bundle"; exit 1; }
            echo "== $(basename "$bundle")"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleVersion' "$bundle/Info.plist"
            codesign -d --entitlements :- "$bundle" 2>/dev/null | grep -A3 -E "keychain-access-groups|application-identifier" || true
          done
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -A3 keychain-access-groups || true

      - name: Upload to TestFlight
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-logs
          path: |
            ios/Podfile.lock
            ios/xcodebuild-archive.log
          if-no-files-found: ignore

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf ~/.appstoreconnect/private_keys "$RUNNER_TEMP"/profile.* "$RUNNER_TEMP/ExportOptions.plist"
