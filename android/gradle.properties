# Project-wide Gradle settings.
# Release signing is NOT stored here. Use environment variables, -P properties,
# or android/keystore.properties (gitignored). See README.

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true

android.useAndroidX=true
android.enableJetifier=true

# AGP 7.4.2 predates compileSdk 34. The SDK is intentional; this avoids a hard fail.
android.suppressUnsupportedCompileSdk=34
